name: Build & Publish ML Docker Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "ml/**"
      - ".github/workflows/deploy-ml.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify or Cache Model Weights
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ml/public/emotion_bert_multilabel
          key: emotion-bert-weights-v1

      - name: Ensure Model Weights Exist on Runner
        run: |
          if [ ! -f "ml/public/emotion_bert_multilabel/model.safetensors" ]; then
            echo "Model weights not found in Git checkout. Fetching weights for container build..."
            pip install --no-cache-dir gdown
            python -c "import gdown; gdown.download_folder('https://drive.google.com/drive/folders/1W2M86I5r18kboy1jGrAMZN4N8Uy4MUu6?usp=drive_link', output='ml/public/emotion_bert_multilabel', quiet=False)"
          else
            echo "Model weights present and ready."
          fi
        shell: bash

      - name: Set lowercase image name
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/moodify-ml"
          echo "IMAGE_NAME=${IMAGE,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ml
          file: ./ml/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Instructions Summary
        run: |
          echo "### 📦 ML Docker Image Successfully Published to GHCR!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image URL:** \`${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit Tag:** \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Azure Container Apps Setup (Zero-Credit Burn):" >> $GITHUB_STEP_SUMMARY
          echo "1. In Azure Portal, set your Container App image to: \`${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Image type: **Public** (no registry credentials or Azure secrets required)" >> $GITHUB_STEP_SUMMARY
          echo "3. Target Port: **8002**" >> $GITHUB_STEP_SUMMARY
          echo "4. In Scale settings, set **Min replicas: 0** and **Max replicas: 2** (Serverless Consumption Profile for zero credit burn)" >> $GITHUB_STEP_SUMMARY
